url: https://michaelbarkasi.github.io/wispack/
template:
  bootstrap: 5
  light-switch: true
  math-rendering: katex

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Introduction
      href: index.html
    reference:
      text: Package Functions
      href: reference/index.html
    github:
      icon: fab fa-github
      href: https://github.com/michaelbarkasi/wispack

articles:
- title: Installation
  navbar: Installation
  contents:
  - install
  - release_notes

- title: Tutorials
  navbar: Tutorials
  contents: 
  - starts_with("tutorial_")

- title: Legal
  navbar: Legal
  contents:
  - license

reference:
- title: Main
  navbar: Main
  contents:
  - wisp
  
- title: Model functions
  navbar: Model functions
  contents:
  - starts_with("wisp.")
  
- title: Analysis functions
  navbar: Analysis functions
  contents:
  - starts_with("analyze.")
  - pvalues.samples
  - sample.stats
  
- title: Plotting functions 
  navbar: Plotting functions
  contents:
  - starts_with("plot")
  - starts_with("demo.")

- title: Benchmarking functions 
  navbar: Benchmarking functions 
  contents:
  - attractor_simulation_ground_truth
  - attractor_simulation
  - model_attractor_simulation_wisp
  - run_attractor_sim_benchmarks

- title: MERFISH preprocessing functions 
  navbar: MERFISH preprocessing functions 
  contents:
  - make_count_data
  - make_count_data_csv
  - cortical_coordinate_transform
  - create.count.data.WSPmm
